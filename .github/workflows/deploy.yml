name: Chicory CI/CD Pipeline

on:
  push:
    branches: [ "main" ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build Frontend
        run: |
          cd chicory-frontend
          npm install
          npm run build

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Spring Boot with Gradle
        run: ./gradlew clean bootJar -x test

      - name: Transfer JAR to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: ${{ secrets.EC2_PORT }}
          source: "build/libs/*.jar"
          target: "/home/ec2-user/chicory"
          strip_components: 2

      - name: Deploy and Restart Application on EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: ${{ secrets.EC2_PORT }}
          script: |
            echo "🚀 Chicory 서비스 배포 시작..."

            # 1. 8082 포트를 열고 있는 프로세스만 찾아서 안전하게 종료
            TARGET_PID=$(lsof -ti :8082 || true)
            if [ -n "$TARGET_PID" ]; then
              echo "기존 8082 포트 프로세스($TARGET_PID) 종료 중..."
              kill -15 $TARGET_PID || true
              sleep 5
            else
              echo "실행 중인 기존 8082 프로세스가 없습니다."
            fi

            # 2. 새 JAR 백그라운드 구동
            cd /home/ec2-user/chicory
            JAR_NAME=$(ls -t *.jar | head -n 1)
            echo "실행할 JAR: $JAR_NAME"

            nohup java -Xms256m -Xmx512m -jar "$JAR_NAME" > app.log 2>&1 &

            sleep 3
            echo "✅ Chicory 구동 확인!"
            ps -ef | grep java | grep 8082 || ps -ef | grep "$JAR_NAME" | grep -v grep