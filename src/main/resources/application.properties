# ==========================================
# characterEncoding/useUnicode ?? (?? ?? ??)
spring.datasource.url=jdbc:mysql://localhost:3306/ofr?useSSL=false&serverTimezone=Asia/Seoul&characterEncoding=UTF-8&useUnicode=true&allowPublicKeyRetrieval=true
